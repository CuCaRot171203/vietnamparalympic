<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Subjects</title>
<style>
body{background:#f7f4ed;font-family:system-ui;padding:20px;margin:0}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
figure{margin:0;background:#fff;border:1px solid #eceae4;border-radius:12px;padding:10px;text-align:center}
img{width:100%;height:120px;object-fit:contain}
figcaption{font-size:12px;margin-top:6px;font-weight:600}
</style></head>
<body>
<div class="grid" id="g"></div>
<script>
const names=["bong_ban.png","ban_cung.png","boi_loi.png","cau_long_ngoi.png","cu_ta.png","dien_kinh.png","khieu_vu.png","nem_dia.png","pickleball_dung.png","tennis_dung.png","tennis_ngoi.png","vo_thuat.png","co_vua.png","boccia.png","bong-ban-dung.png","cau-long-dung.png","pickleball.png","yoga.png"];
document.getElementById('g').innerHTML=names.map(n=>`<figure><img src="/subjects/${n}"><figcaption>${n}</figcaption></figure>`).join('');
</script>
</body></html>
